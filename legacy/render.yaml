services:
  - type: web
    name: process-analysis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm run build
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: ANALYSIS_HOME
        value: /tmp/process-analysis
      - key: ANALYSIS_PASSWORD
        generateValue: true
